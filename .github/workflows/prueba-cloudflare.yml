name: Prueba de acceso (sin credenciales)

# Solo comprueba si un navegador real, desde los servidores de GitHub,
# llega a las páginas de login sin que Cloudflare pida verificación manual.
# No usa credenciales ni intenta resolver desafíos.
on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Abrir las páginas de login
        run: xvfb-run -a node pruebas/prueba_actions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
